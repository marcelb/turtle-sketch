services:
  whiteboard:
    image: marcelb/turtle-sketch:latest
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
